<title>Bitácora de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#ECEFF1;--surface:#FFFFFF;--surface-2:#F5F7F8;--ink:#14212B;--ink-2:#3B4955;--muted:#5E6D79;--line:#D3DAE0;--line-2:#E4E9ED;
  --primary:#1B3F63;--primary-ink:#FFFFFF;--primary-soft:#E0E9F2;
  --accent:#E8A317;--accent-ink:#1C1500;
  --nav-bg:#12304D;--nav-ink:#C7D5E2;--nav-ink-strong:#FFFFFF;--nav-active:rgba(255,255,255,.09);
  --t-general:#3A6EA5;--t-labor:#2F7D4F;--t-stock:#B4541C;--t-tx:#6B4C9A;
  --ok:#2A7148;--ok-soft:#E1F0E6;--warn:#8F5B00;--warn-soft:#FAEFD6;--bad:#B3261E;--bad-soft:#F8E1DF;
  --focus:#2F6FB0;--shadow:0 8px 28px rgba(12,24,36,.18);
  --r:8px;--r-sm:6px;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D161E;--surface:#15212B;--surface-2:#1A2833;--ink:#E3EAF0;--ink-2:#B9C6D0;--muted:#8B9BA7;--line:#2B3B48;--line-2:#22313C;
  --primary:#8CB6E0;--primary-ink:#0D161E;--primary-soft:#1D3147;--accent:#F0B429;--accent-ink:#1C1500;
  --nav-bg:#0A131A;--nav-ink:#9FB2C2;--nav-ink-strong:#FFFFFF;--nav-active:rgba(255,255,255,.07);
  --t-general:#80AAD8;--t-labor:#6DBD8B;--t-stock:#E38D58;--t-tx:#AE90DA;
  --ok:#74C495;--ok-soft:#16301F;--warn:#E8B45A;--warn-soft:#33270F;--bad:#F29389;--bad-soft:#3A1C1A;
  --focus:#8CB6E0;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0D161E;--surface:#15212B;--surface-2:#1A2833;--ink:#E3EAF0;--ink-2:#B9C6D0;--muted:#8B9BA7;--line:#2B3B48;--line-2:#22313C;
  --primary:#8CB6E0;--primary-ink:#0D161E;--primary-soft:#1D3147;--accent:#F0B429;--accent-ink:#1C1500;
  --nav-bg:#0A131A;--nav-ink:#9FB2C2;--nav-ink-strong:#FFFFFF;--nav-active:rgba(255,255,255,.07);
  --t-general:#80AAD8;--t-labor:#6DBD8B;--t-stock:#E38D58;--t-tx:#AE90DA;
  --ok:#74C495;--ok-soft:#16301F;--warn:#E8B45A;--warn-soft:#33270F;--bad:#F29389;--bad-soft:#3A1C1A;
  --focus:#8CB6E0;--shadow:0 8px 28px rgba(0,0,0,.5);color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Estructura ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav-bg);color:var(--nav-ink);display:flex;flex-direction:column;gap:2px;padding:20px 12px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;color:var(--nav-ink-strong);text-decoration:none}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 21px/1 var(--f-display);letter-spacing:.02em;display:block}
.brand small{font:500 11px/1.2 var(--f-body);color:var(--nav-ink);letter-spacing:.06em;text-transform:uppercase}
.nav a.tab{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--nav-ink);text-decoration:none;font-weight:600}
.nav a.tab:hover{color:var(--nav-ink-strong);background:var(--nav-active)}
.nav a.tab[aria-current="page"]{color:var(--nav-ink-strong);background:var(--nav-active)}
.nav a.tab[aria-current="page"] .ic{color:var(--accent)}
.nav-foot{margin-top:auto;display:grid;gap:8px;padding:8px}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--nav-active);color:var(--nav-ink-strong);border:0;cursor:pointer;text-align:left}
.sync-pill .dot{width:8px;height:8px;border-radius:50%;background:#8BA0B3;flex:none}
.sync-pill[data-state="ok"] .dot{background:#5CC08A}
.sync-pill[data-state="pending"] .dot{background:#F0B429}
.sync-pill[data-state="offline"] .dot{background:#F28B82}
main{min-width:0}
.topbar{display:none}
@media (max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30;gap:0}
  .nav .brand,.nav .nav-foot{display:none}
  .nav a.tab{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;font-weight:600}
  .nav a.tab .ic{width:22px;height:22px}
  main{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--nav-bg);color:var(--nav-ink-strong);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .brand{padding:0}
  .topbar .brand svg{width:28px;height:28px}
  .topbar .brand b{font-size:18px}
}

/* ---------- Página ---------- */
.page{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
@media (min-width:900px){.page{padding-inline:32px;padding-block:28px 64px}}
.page.narrow{max-width:760px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head > div:first-child{min-width:0;flex:1 1 280px}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.eyebrow a{color:inherit}
h1{font:600 32px/1.05 var(--f-display);letter-spacing:.01em;margin:0;text-wrap:balance;overflow-wrap:anywhere}
h2{font:600 19px/1.15 var(--f-display);letter-spacing:.05em;text-transform:uppercase;margin:0;color:var(--ink-2)}
h3{font:600 16px/1.3 var(--f-body);margin:0}
p{margin:0}
.section{display:grid;gap:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;min-width:0}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:14px}
.banner .ic{color:var(--warn);margin-top:2px}
.banner.info{background:var(--primary-soft)}
.banner.info .ic{color:var(--primary)}

/* ---------- Controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:0 10px;font-size:13.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-sm);border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.chip .sw{width:9px;height:9px;border-radius:2px;background:var(--tc,var(--muted))}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.field{display:grid;gap:5px;min-width:0}
.field > span,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=search],input[type=email],input:not([type]),input[type=date],input[type=datetime-local],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;min-height:38px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.form{display:grid;gap:16px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:4px}
fieldset.group{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0;display:grid;gap:10px;background:var(--surface-2)}
fieldset.group legend{font:600 13px var(--f-body);color:var(--ink-2);padding:0 6px}
.type-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.type-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.type-pick button{display:grid;justify-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.type-pick button .ic{width:24px;height:24px;color:var(--tc)}
.type-pick button[aria-pressed="true"]{border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 11%,var(--surface));padding:11px 5px}
.line{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:grid;gap:8px}
.line-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.line-grid{display:grid;gap:8px}
.line-grid.labor{grid-template-columns:minmax(0,1.2fr) minmax(0,1.5fr) 84px}
.line-grid.stock{grid-template-columns:minmax(0,1.5fr) auto 110px minmax(0,1fr);align-items:end}
@media (max-width:640px){.line-grid.labor{grid-template-columns:minmax(0,1fr) 84px}.line-grid.labor .task{grid-column:1 / -1;order:3}.line-grid.stock{grid-template-columns:minmax(0,1fr) 110px}.line-grid.stock .item,.line-grid.stock .resp{grid-column:1 / -1}}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--ink);font-size:13.5px;font-weight:600}
.tag button{border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;width:22px;height:22px;border-radius:50%}
.tag.sugg{background:transparent;border:1px dashed var(--line);color:var(--muted);padding:3px 10px;cursor:pointer}
.tags-line{color:var(--primary);font-size:13.5px;font-weight:600;overflow-wrap:anywhere}
.loc-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.loc-box .ic{color:var(--muted)}
.loc-box.has .ic{color:var(--ok)}
.att-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.att{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px}
.att img,.thumb{width:84px;height:84px;object-fit:cover;border-radius:4px;background:var(--line-2)}
.att textarea{min-height:60px}
.att.file{grid-template-columns:40px minmax(0,1fr) auto;align-items:center}
.file-ic{width:40px;height:40px;border-radius:6px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary)}

/* ---------- Estados ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.pill.ACTIVE{background:var(--ok-soft);color:var(--ok)}
.pill.PLANNED{background:var(--primary-soft);color:var(--primary)}
.pill.ON_HOLD{background:var(--warn-soft);color:var(--warn)}
.pill.CLOSED{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.pend{background:var(--warn-soft);color:var(--warn)}
.pill.role{background:var(--primary-soft);color:var(--primary)}
.pill .ic{width:13px;height:13px}

/* ---------- Tarjetas de proyecto y KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.kpi b{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi small{font-size:12.5px;color:var(--muted)}
.plist{display:grid;gap:10px}
.pcard{display:grid;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit}
.pcard:hover{border-color:var(--muted)}
.pcard .row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pcard h3{font:600 20px/1.15 var(--f-display);letter-spacing:.01em}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:14px;height:14px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0;font-size:14.5px}
.dl dt{color:var(--muted);font-size:13px;padding-top:1px}
.dl dd{margin:0;overflow-wrap:anywhere}
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t .r{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Línea de tiempo ---------- */
.day{display:grid;gap:2px}
.day-head{display:flex;align-items:baseline;gap:12px;padding-block:14px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.day-date{font:600 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em}
.day-meta{font-size:13px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:61px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-item{display:grid;grid-template-columns:48px 28px minmax(0,1fr);align-items:start;padding-block:6px}
.tl-time{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);text-align:right;padding-top:13px}
.tl-node{width:12px;height:12px;border-radius:50%;background:var(--tc);box-shadow:0 0 0 3px var(--ground);margin:17px auto 0;position:relative;z-index:1}
.tl-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:inherit;text-decoration:none}
.tl-body:hover{border-color:var(--muted)}
.tl-main{display:grid;gap:4px;min-width:0}
.tl-type{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.tl-type .ic{width:15px;height:15px;color:var(--tc)}
.tl-type .folio{margin-left:auto;font-family:var(--f-mono);font-weight:500;letter-spacing:0;color:var(--muted)}
.tl-sum{font-weight:700}
.tl-text{color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tl-body .thumb{width:72px;height:72px}
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty .ic{width:36px;height:36px;stroke-width:1.5}
.empty b{color:var(--ink);font-size:16px}

/* ---------- Detalle de registro ---------- */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.photo{margin:0;display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:zoom-in;padding:0;text-align:left}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line-2);display:block}
.photo figcaption{font-size:13px;padding:0 8px 8px;color:var(--ink-2)}
.amount{font:600 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.amount.in{color:var(--ok)}
.amount.out{color:var(--bad)}
.comment{display:grid;gap:2px;padding-block:8px;border-bottom:1px solid var(--line-2)}
.comment:last-of-type{border-bottom:0}
.comment b{font-size:14px}
.comment time{font-size:12.5px;color:var(--muted)}
.dir{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.dir.IN{color:var(--ok)}
.dir.OUT{color:var(--bad)}

/* ---------- Gráfico ---------- */
.chart{margin:0;min-height:190px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font:500 11px var(--f-mono)}
.chart .val{fill:var(--ink);font:600 12px var(--f-mono)}
.chart .bar{fill:var(--primary)}
.chart .col:hover .bar,.chart .col:focus .bar{fill:var(--accent)}
.chart .col{outline:none}
.chart .hit{fill:transparent}
details.data summary{cursor:pointer;font-size:13px;color:var(--muted)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;padding:6px 9px;border-radius:6px;max-width:240px;box-shadow:var(--shadow)}

/* ---------- Diálogos y avisos ---------- */
dialog{border:0;padding:0;border-radius:12px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 48px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,16,24,.55)}
dialog.viewer{width:min(1000px,calc(100vw - 24px));background:#0B1116;color:#F2F5F7}
.dlg-body{display:grid;gap:14px;padding:20px}
.dlg-body h2{color:var(--ink)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.viewer img{display:block;width:100%;max-height:78dvh;object-fit:contain;background:#000}
.viewer .cap{padding:12px 16px;font-size:14.5px}
.viewer .close{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff}

<script>
(() => {
'use strict';

/* ============================================================
   Formato (es-CL) y utilidades
   ============================================================ */
const WD = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const WDL = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MO = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MOL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pad = (n) => String(n).padStart(2, '0');
const D = (v) => (v instanceof Date ? v : new Date(v));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowIso = () => new Date().toISOString();
const clone = (x) => JSON.parse(JSON.stringify(x));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const parseDateOnly = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (v) => { if (!v) return '—'; const d = D(v); return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`; };
const fmtDateOnly = (s) => (s ? fmtDate(parseDateOnly(s)) : '—');
const fmtTime = (v) => { const d = D(v); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDT = (v) => `${fmtDate(v)} ${fmtTime(v)}`;
const fmtDayShort = (v) => { const d = D(v); return `${WD[d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const fmtDayLong = (v) => { const d = D(v); return `${WDL[d.getDay()]} ${d.getDate()} de ${MOL[d.getMonth()]} de ${d.getFullYear()}`; };
const dayKey = (v) => { const d = D(v); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const toLocalInput = (d) => `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fromLocalInput = (s) => {
  const [date, time = '00:00'] = String(s).split('T');
  const [y, m, d] = date.split('-').map(Number);
  const [hh, mm] = time.split(':').map(Number);
  return new Date(y, m - 1, d, hh || 0, mm || 0);
};
function fmtNum(n, dec = 0) {
  if (n === null || n === undefined || Number.isNaN(n)) return '—';
  const [i, f] = Math.abs(n).toFixed(dec).split('.');
  return (n < 0 ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f ? ',' + f : '');
}
const fmtQty = (n) => (n === null || n === undefined ? '—' : Number.isInteger(n) ? fmtNum(n) : fmtNum(n, 2).replace(/,?0+$/, ''));
const fmtMoney = (a, c) => (c === 'USD' ? `US$ ${fmtNum(a, 2)}` : c === 'UF' ? `UF ${fmtNum(a, 2)}` : `$ ${fmtNum(a, 0)}`);
const fmtBytes = (n) => (!n ? '' : n < 1024 ? `${n} B` : n < 1048576 ? `${fmtNum(n / 1024)} KB` : `${fmtNum(n / 1048576, 1)} MB`);
/** "150.000" → 150000 · "1.234,5" → 1234.5 · "7,5" / "7.5" → 7.5 */
function parseDecimal(input) {
  const s = String(input ?? '').trim().replace(/\s/g, '').replace(/^\$/, '');
  if (!s) return null;
  const norm = /^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s) ? s.replace(/\./g, '').replace(',', '.') : s.replace(',', '.');
  const n = Number(norm);
  return Number.isFinite(n) ? n : null;
}
const normTag = (t) => String(t).trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '-');
const fmtCoords = (lat, lng) => `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
const mapsUrl = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

/** UUID v7: se genera en el dispositivo para que un registro creado sin señal ya tenga su ID definitivo. */
function uuid() {
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  const ts = Date.now();
  b[0] = Math.floor(ts / 2 ** 40) & 255; b[1] = Math.floor(ts / 2 ** 32) & 255; b[2] = Math.floor(ts / 2 ** 24) & 255;
  b[3] = Math.floor(ts / 2 ** 16) & 255; b[4] = Math.floor(ts / 2 ** 8) & 255; b[5] = ts & 255;
  b[6] = (b[6] & 15) | 0x70; b[8] = (b[8] & 63) | 0x80;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
const ic = (name, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

/* ============================================================
   Catálogo de etiquetas del dominio
   ============================================================ */
const ROLE = { ADMIN: 'Administrador', SUPERVISOR: 'Supervisor', OPERATOR: 'Operador de campo' };
const PSTATUS = { ACTIVE: 'Activo', PLANNED: 'Planificado', ON_HOLD: 'Suspendido', CLOSED: 'Cerrado' };
const ETYPE = {
  GENERAL: { label: 'General', icon: 'note', v: '--t-general' },
  LABOR: { label: 'Personal', icon: 'hardhat', v: '--t-labor' },
  STOCK: { label: 'Stock / activos', icon: 'package', v: '--t-stock' },
  TRANSACTION: { label: 'Ingreso / egreso', icon: 'cash', v: '--t-tx' },
};
const ICAT = { MATERIAL: 'Material', TOOL: 'Herramienta', EQUIPMENT: 'Equipo', ASSET: 'Activo' };
const CURRENCIES = ['CLP', 'USD', 'UF'];
const EDIT_WINDOW_H = 48;
const CATDEF = {
  workers: {
    label: 'Personal', single: 'persona', icon: 'hardhat',
    fields: [
      { k: 'full_name', l: 'Nombre completo', req: true },
      { k: 'tax_id', l: 'RUT', ph: '12.345.678-9' },
      { k: 'company', l: 'Empresa / contratista' },
      { k: 'position', l: 'Cargo', ph: 'Mecánico, soldador, rigger…' },
    ],
    title: (x) => x.full_name, sub: (x) => [x.position, x.company, x.tax_id],
    defaults: (name) => ({ full_name: name, tax_id: null, company: null, position: null }),
  },
  items: {
    label: 'Ítems', single: 'ítem', icon: 'package',
    fields: [
      { k: 'name', l: 'Nombre', req: true, ph: 'Cemento, rodillo de carga…' },
      { k: 'code', l: 'Código / SKU' },
      { k: 'unit', l: 'Unidad', req: true, ph: 'un, kg, m, m³, saco…' },
    ],
    title: (x) => x.name, sub: (x) => [x.code, ICAT[x.category], x.unit && `unidad: ${x.unit}`],
    defaults: (name) => ({ name, code: null, unit: 'un', category: 'MATERIAL' }),
  },
  suppliers: {
    label: 'Proveedores', single: 'proveedor', icon: 'brief',
    fields: [
      { k: 'name', l: 'Razón social / nombre', req: true },
      { k: 'tax_id', l: 'RUT', ph: '76.123.456-7' },
      { k: 'contact_name', l: 'Contacto' },
      { k: 'phone', l: 'Teléfono' },
      { k: 'email', l: 'Email' },
    ],
    title: (x) => x.name, sub: (x) => [x.tax_id, x.contact_name, x.phone],
    defaults: (name) => ({ name, tax_id: null, contact_name: null, phone: null, email: null }),
  },
};

/* ============================================================
   Almacenamiento local (IndexedDB): caché + cola de envío
   ============================================================ */
const Local = {
  db: null,
  async open() {
    try {
      if (!('indexedDB' in window)) return;
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('bitacora-campo', 1);
        r.onupgradeneeded = () => {
          for (const s of ['records', 'blobs', 'meta']) if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s);
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    } catch { this.db = null; }
  },
  run(store, mode, fn) {
    if (!this.db) return Promise.resolve(undefined);
    return new Promise((res) => {
      try {
        const tx = this.db.transaction(store, mode);
        const req = fn(tx.objectStore(store));
        tx.oncomplete = () => res(req ? req.result : undefined);
        tx.onerror = tx.onabort = () => res(undefined);
      } catch { res(undefined); }
    });
  },
  get(store, key) { return this.run(store, 'readonly', (s) => s.get(key)); },
  put(store, key, val) { return this.run(store, 'readwrite', (s) => s.put(val, key)); },
  del(store, key) { return this.run(store, 'readwrite', (s) => s.delete(key)); },
  all(store) { return this.run(store, 'readonly', (s) => s.getAll()); },
};

/* ============================================================
   Estado y sincronización
   ============================================================ */
const COLS = ['projects', 'entries', 'workers', 'items', 'suppliers', 'comments', 'members'];
const S = {
  data: Object.fromEntries(COLS.map((c) => [c, new Map()])),
  pending: new Set(), inflight: new Set(),
  mode: 'starting', // starting | local | cloud
  db: null, assets: null, user: null, downloads: null,
  me: null, isOwner: false, canWrite: true,
  names: {}, avatars: {},
  online: navigator.onLine, flushing: false, retryMs: 2000,
  firstSnap: new Set(), registered: false,
  mediaUrls: new Map(), mediaLoading: new Set(), mediaMissing: new Set(),
  formActive: false, partial: null, lastPath: null,
};
const keyOf = (c, id) => `${c}/${id}`;
const all = (c) => [...S.data[c].values()].filter((x) => !x.deleted_at);
const byId = (c, id) => (id ? S.data[c].get(id) : undefined);
const live = (c, id) => { const x = byId(c, id); return x && !x.deleted_at ? x : undefined; };

async function save(col, obj) {
  const prev = S.data[col].get(obj.id);
  const ts = nowIso();
  const doc = clone({ ...obj, created_at: prev?.created_at || obj.created_at || ts, updated_at: ts, version: (prev?.version || 0) + 1 });
  if (!('deleted_at' in doc)) doc.deleted_at = null;
  S.data[col].set(doc.id, doc);
  S.pending.add(keyOf(col, doc.id));
  await Local.put('records', keyOf(col, doc.id), { col, id: doc.id, data: doc, pending: true });
  changed();
  queueFlush(200);
  return doc;
}
const softDelete = (col, obj) => save(col, { ...obj, deleted_at: nowIso() });

function applyRemote(col, snap) {
  let dirty = false;
  if (!S.firstSnap.has(col)) {
    // Primera foto del servidor: descarta de la caché lo que ya no existe allá (salvo lo pendiente de enviar).
    const ids = new Set(snap.docs.map((d) => d.id));
    for (const id of [...S.data[col].keys()]) {
      const key = keyOf(col, id);
      if (!ids.has(id) && !S.pending.has(key)) { S.data[col].delete(id); Local.del('records', key); dirty = true; }
    }
  }
  for (const ch of snap.docChanges()) {
    const id = ch.doc.id; const key = keyOf(col, id);
    if (ch.type === 'removed') {
      if (!S.pending.has(key) && S.data[col].has(id)) { S.data[col].delete(id); Local.del('records', key); dirty = true; }
      continue;
    }
    const remote = ch.doc.data();
    if (!remote) continue;
    const local = S.data[col].get(id);
    if (S.pending.has(key) && local && (local.updated_at || '') >= (remote.updated_at || '')) continue;
    const doc = { ...clone(remote), id };
    S.data[col].set(id, doc);
    S.pending.delete(key);
    Local.put('records', key, { col, id, data: doc, pending: false });
    dirty = true;
  }
  const first = !S.firstSnap.has(col);
  S.firstSnap.add(col);
  if (col === 'members' && first) registerSelf();
  if (dirty || first) changed();
}

let flushTimer = null;
function queueFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }

async function flush() {
  if (S.mode !== 'cloud' || !S.db || S.flushing || !S.canWrite) { updateSync(); return; }
  S.flushing = true; updateSync();
  let failed = false;
  try {
    for (const key of [...S.pending]) {
      if (S.inflight.has(key)) continue;
      const [col, id] = key.split('/');
      const doc = S.data[col]?.get(id);
      if (!doc) { S.pending.delete(key); continue; }
      const sent = doc.updated_at;
      // Una escritura a la vez por documento, aunque la anterior haya excedido el tiempo de espera.
      S.inflight.add(key);
      const p = S.db.doc(key).set(clone(doc));
      p.then(() => S.inflight.delete(key), () => S.inflight.delete(key));
      try {
        await withTimeout(p, 15000);
        const cur = S.data[col].get(id);
        if (cur && cur.updated_at === sent) {
          S.pending.delete(key);
          await Local.put('records', key, { col, id, data: cur, pending: false });
        }
      } catch (e) {
        failed = true;
        if (e?.code === 'invalid_argument') { S.canWrite = false; toast('Tu acceso a esta bitácora es de solo lectura.', 'bad'); scheduleRender(); }
        else if (e?.code === 'quota_exceeded') toast('La base compartida alcanzó su límite de documentos. Elimina registros antiguos o migra al servidor definitivo.', 'bad');
        break;
      }
    }
    if (!failed) failed = !(await flushMedia());
  } finally {
    S.flushing = false;
    S.retryMs = failed ? Math.min(S.retryMs * 2, 60000) : 2000;
    updateSync();
    if (S.pending.size || failed) queueFlush(failed ? S.retryMs : 1500);
  }
}

/* ---------- Fotos y archivos ---------- */
const ASSET_TYPES = new Set(['image/png', 'image/jpeg', 'image/gif', 'image/webp', 'application/pdf', 'text/csv', 'text/plain', 'application/json', 'text/markdown']);
const DB_MEDIA_MAX = 190 * 1024;
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
const attSynced = (a) => !!(a.asset || a.media || a.local_only);

// Las imágenes se muestran como data: URL (no blob:), que la política de contenido de la página siempre admite.
function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
function dataUrlToBlob(url) {
  const [head, b64] = url.split(',');
  const mime = /data:([^;,]+)/.exec(head)?.[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function loadBitmap(blob) {
  if ('createImageBitmap' in window) { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch { /* usa <img> */ } }
  const src = await blobToDataUrl(blob);
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('imagen ilegible'));
    img.src = src;
  });
}
/** Reduce la foto a `maxSide` px y JPEG: evidencia suficiente y liviana para datos móviles. */
async function toJpeg(blob, maxSide, quality) {
  const bmp = await loadBitmap(blob);
  const s = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * s)); const h = Math.max(1, Math.round(bmp.height * s));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const out = await new Promise((res) => c.toBlob(res, 'image/jpeg', quality));
  if (!out) throw new Error('no se pudo comprimir');
  return { blob: out, width: w, height: h };
}
async function shrinkToFit(blob, max) {
  for (const [side, q] of [[1280, 0.6], [1024, 0.55], [800, 0.5], [640, 0.45]]) {
    const r = await toJpeg(blob, side, q);
    if (r.blob.size <= max) return r.blob;
  }
  return null;
}

/** Sube los adjuntos pendientes. Devuelve false si hay que reintentar más tarde. */
async function flushMedia() {
  if (!S.db) return true;
  const items = (await Local.all('blobs')) || [];
  for (const m of items) {
    if (m.state !== 'pending') continue;
    const entry = S.data.entries.get(m.entryId);
    const att = entry?.attachments?.find((a) => a.id === m.id);
    if (!entry || entry.deleted_at || !att) { await Local.del('blobs', m.id); continue; }
    if (attSynced(att)) { await Local.put('blobs', m.id, { ...m, state: 'done' }); continue; }
    let patch = null;
    try {
      if (S.assets && ASSET_TYPES.has(m.mime)) {
        const r = await withTimeout(S.assets.upload(m.blob, { type: m.mime }), 90000);
        patch = { asset: r.id };
      }
    } catch (e) {
      if (['not_granted', 'capability_disabled', 'capability_removed'].includes(e?.code)) S.assets = null;
      else if (!['unsupported_type', 'too_large', 'quota_or_state'].includes(e?.code)) return false;
    }
    if (!patch) {
      // Sin permiso de subida de archivos: la versión reducida viaja dentro de la base compartida.
      try {
        let blob = m.blob;
        if (blob.size > DB_MEDIA_MAX && String(m.mime).startsWith('image/')) blob = await shrinkToFit(blob, DB_MEDIA_MAX);
        if (blob && blob.size <= DB_MEDIA_MAX) {
          const data = await blobToDataUrl(blob);
          await withTimeout(S.db.doc(`media/${m.id}`).set({ data, mime: blob.type || m.mime, entry_id: m.entryId }), 20000);
          patch = { media: true };
        } else patch = { local_only: true };
      } catch { return false; }
    }
    const fresh = S.data.entries.get(m.entryId);
    if (!fresh) continue;
    await save('entries', { ...fresh, attachments: fresh.attachments.map((a) => (a.id === m.id ? { ...a, ...patch } : a)) });
    await Local.put('blobs', m.id, { ...m, state: patch.local_only ? 'local' : 'done' });
  }
  return true;
}

function mediaSrc(att) {
  if (att.asset) return '/_blob/' + att.asset;
  if (att.previewUrl) return att.previewUrl;
  const cached = S.mediaUrls.get(att.id);
  if (cached) return cached;
  if (!S.mediaMissing.has(att.id)) loadMedia(att);
  return BLANK;
}
async function loadMedia(att) {
  if (S.mediaLoading.has(att.id)) return;
  S.mediaLoading.add(att.id);
  let url = null;
  try {
    const m = await Local.get('blobs', att.id);
    if (m?.blob && String(m.mime).startsWith('image/')) url = await blobToDataUrl(m.blob);
    else if (att.media && S.db) {
      const snap = await S.db.doc(`media/${att.id}`).get();
      if (snap.exists) url = snap.data().data;
    }
  } catch { /* se muestra el marcador */ }
  S.mediaLoading.delete(att.id);
  if (!url) { S.mediaMissing.add(att.id); return; }
  S.mediaUrls.set(att.id, url);
  document.querySelectorAll(`[data-media="${att.id}"]`).forEach((el) => { if (el.tagName === 'IMG') el.src = url; });
}
async function mediaBlob(att) {
  if (att.asset) { const r = await fetch('/_blob/' + att.asset); if (!r.ok) throw new Error('no disponible'); return r.blob(); }
  const m = await Local.get('blobs', att.id);
  if (m?.blob) return m.blob;
  if (att.media && S.db) { const snap = await S.db.doc(`media/${att.id}`).get(); if (snap.exists) return dataUrlToBlob(snap.data().data); }
  throw new Error('El archivo aún no se sube desde el dispositivo que lo capturó.');
}
async function mediaDataUrl(att) {
  const cached = S.mediaUrls.get(att.id);
  if (cached && cached.startsWith('data:')) return cached;
  return blobToDataUrl(await mediaBlob(att));
}

/* ---------- Identidad y permisos ---------- */
async function initCloud() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return false;
  const use = (n) => c.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
  S.downloads = downloads;
  if (!db) return false;
  S.db = db; S.assets = assets; S.user = user;
  if (user) {
    const me = await user.me();
    S.isOwner = !!me.isOwner;
    if (me.id) S.me = { id: me.id };
    if (me.name) S.names[me.id] = me.name;
    if (me.avatarUrl && me.id) S.avatars[me.id] = me.avatarUrl;
    if ((await user.can('data.write')) === false) S.canWrite = false;
  }
  if (!S.me) {
    let anon = await Local.get('meta', 'anonId');
    if (!anon) { anon = 'anon-' + uuid(); await Local.put('meta', 'anonId', anon); }
    S.me = { id: anon };
  }
  S.mode = 'cloud';
  for (const col of COLS) {
    db.collection(col).onSnapshot((snap) => applyRemote(col, snap), (err) => {
      console.warn('Suscripción', col, err);
      if (err?.code === 'revoked') { S.canWrite = false; updateSync(); }
    });
  }
  return true;
}
function registerSelf() {
  if (S.registered || S.mode !== 'cloud' || !S.me || !S.canWrite) return;
  S.registered = true;
  if (!S.data.members.get(S.me.id)) save('members', { id: S.me.id, role: S.isOwner ? 'ADMIN' : 'OPERATOR', joined_at: nowIso() });
}
function myRole() {
  const m = S.me && S.data.members.get(S.me.id);
  return m?.role || (S.isOwner ? 'ADMIN' : 'OPERATOR');
}
function nameOf(id) {
  if (!id) return '—';
  if (id === 'ejemplo') return 'Ejemplo';
  return S.names[id] || S.data.members.get(id)?.name || (S.me && id === S.me.id ? 'Tú' : 'Usuario');
}
let namesTimer = null;
function refreshNames() {
  if (!S.user) return;
  clearTimeout(namesTimer);
  namesTimer = setTimeout(async () => {
    const ids = new Set();
    for (const e of S.data.entries.values()) if (e.author_id) ids.add(e.author_id);
    for (const c of S.data.comments.values()) if (c.author_id) ids.add(c.author_id);
    for (const m of S.data.members.values()) ids.add(m.id);
    ids.delete('ejemplo');
    if (!ids.size) return;
    const ps = await S.user.profiles([...ids]);
    let dirty = false;
    for (const [id, p] of Object.entries(ps)) {
      if (p.name && S.names[id] !== p.name) { S.names[id] = p.name; dirty = true; }
      if (p.avatarUrl) S.avatars[id] = p.avatarUrl;
    }
    if (dirty) scheduleRender();
  }, 150);
}
const canWrite = () => S.canWrite && !!S.me;
const canEditEntry = (e) => {
  if (!canWrite()) return false;
  if (myRole() !== 'OPERATOR') return true;
  return e.author_id === S.me.id && Date.now() - Date.parse(e.created_at) < EDIT_WINDOW_H * 3600e3;
};
const canEditProject = (p) => canWrite() && (myRole() !== 'OPERATOR' || p.created_by === S.me.id);
const canDeleteCatalog = () => canWrite() && myRole() !== 'OPERATOR';
const canManageTeam = () => canWrite() && myRole() === 'ADMIN';

   Consultas de dominio
   ============================================================ */
const projectName = (id) => byId('projects', id)?.name || 'Proyecto eliminado';
const laborHours = (e) => (e.labor || []).reduce((s, l) => s + (Number(l.hours) || 0), 0);
function visibleEntries() {
  return all('entries').filter((e) => live('projects', e.project_id)).sort((a, b) => b.occurred_at.localeCompare(a.occurred_at));
}
/** Folio correlativo por proyecto, como las páginas de un libro de obras: nunca se renumera. */
function folios(projectId) {
  const list = [...S.data.entries.values()].filter((e) => e.project_id === projectId)
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || '') || a.id.localeCompare(b.id));
  return new Map(list.map((e, i) => [e.id, i + 1]));
}
const folioTxt = (n) => (n ? `N° ${String(n).padStart(4, '0')}` : '');
function entrySummary(e) {
  if (e.type === 'LABOR') { const n = (e.labor || []).length; return `${n} ${n === 1 ? 'persona' : 'personas'} · ${fmtQty(laborHours(e))} h`; }
  if (e.type === 'STOCK') {
    return (e.stock || []).slice(0, 2).map((l) => `${l.direction === 'IN' ? 'Entrada' : 'Salida'} ${fmtQty(l.quantity)} ${byId('items', l.item_id)?.unit || ''} ${byId('items', l.item_id)?.name || ''}`.replace(/\s+/g, ' ').trim()).join(' · ')
      + ((e.stock || []).length > 2 ? ` · +${e.stock.length - 2} más` : '');
  }
  if (e.type === 'TRANSACTION' && e.transaction) {
    const t = e.transaction;
    return `${t.kind === 'INCOME' ? 'Ingreso' : 'Egreso'} ${fmtMoney(t.amount, t.currency)} · ${t.concept}`;
  }
  return '';
}
function projectSummary(pid) {
  const entries = all('entries').filter((e) => e.project_id === pid);
  const counts = { GENERAL: 0, LABOR: 0, STOCK: 0, TRANSACTION: 0 };
  const money = {}; const stock = {}; const workers = {};
  let hours = 0;
  for (const e of entries) {
    counts[e.type] = (counts[e.type] || 0) + 1;
    for (const l of e.labor || []) { hours += Number(l.hours) || 0; workers[l.worker_id] = (workers[l.worker_id] || 0) + (Number(l.hours) || 0); }
    for (const l of e.stock || []) {
      const s = (stock[l.item_id] ||= { in: 0, out: 0 });
      s[l.direction === 'IN' ? 'in' : 'out'] += Number(l.quantity) || 0;
    }
    if (e.transaction) {
      const k = `${e.transaction.kind}|${e.transaction.currency}`;
      money[k] = (money[k] || 0) + (Number(e.transaction.amount) || 0);
    }
  }
  return {
    total: entries.length, counts, hours,
    workers: Object.entries(workers).map(([id, h]) => ({ name: byId('workers', id)?.full_name || '—', hours: h })).sort((a, b) => b.hours - a.hours),
    money: Object.entries(money).map(([k, total]) => { const [kind, currency] = k.split('|'); return { kind, currency, total }; }).sort((a, b) => a.currency.localeCompare(b.currency) || a.kind.localeCompare(b.kind)),
    stock: Object.entries(stock).map(([id, s]) => ({ name: byId('items', id)?.name || '—', unit: byId('items', id)?.unit || 'un', ...s })).sort((a, b) => a.name.localeCompare(b.name, 'es')),
  };
}
function allTags() {
  const count = {};
  for (const e of all('entries')) for (const t of e.tags || []) count[t] = (count[t] || 0) + 1;
  return Object.keys(count).sort((a, b) => count[b] - count[a] || a.localeCompare(b, 'es'));
}
function pendingCounts() {
  const c = { entries: 0, projects: 0, comments: 0, catalogs: 0, members: 0, media: 0 };
  for (const k of S.pending) {
    const col = k.split('/')[0];
    if (col === 'entries' || col === 'projects' || col === 'comments' || col === 'members') c[col]++;
    else c.catalogs++;
  }
  for (const e of all('entries')) for (const a of e.attachments || []) if (!attSynced(a)) c.media++;
  return c;
}

/* ============================================================
   Enrutado y render
   ============================================================ */
function parseRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { path, parts: path.split('/').filter(Boolean), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
let renderQueued = false;
function scheduleRender() {
  updateSync();
  if (S.formActive || renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; if (S.formActive) return; if (S.partial) S.partial(); else render(); });
}
function changed() { refreshNames(); scheduleRender(); }

function render() {
  const { path, parts, q } = parseRoute();
  const top = parts[0] || '';
  document.querySelectorAll('.nav a.tab').forEach((a) => {
    const t = a.dataset.tab;
    const on = t === top || (t === 'proyectos' && (top === 'proyecto' || top === 'registro'));
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  S.formActive = false; S.partial = null; tip.hidden = true;
  if (S.mode === 'starting') { view.innerHTML = `<div class="skeleton">${ic('cloud')}<span>Conectando con la bitácora…</span></div>`; return; }
  if (!S.me) { viewOnboarding(); return; }
  switch (top) {
    case '': view.innerHTML = viewPanel(); drawChart(); break;
    case 'proyectos': view.innerHTML = viewProjects(q); break;
    case 'proyecto':
      if (parts[1] === 'nuevo') viewProjectForm(null);
      else if (parts[2] === 'editar') viewProjectForm(parts[1]);
      else view.innerHTML = viewProject(parts[1], q);
      break;
    case 'registro':
      if (parts[1] === 'nuevo') viewEntryForm(null, q);
      else if (parts[2] === 'editar') viewEntryForm(parts[1], q);
      else view.innerHTML = viewEntry(parts[1]);
      break;
    case 'buscar': viewSearch(); break;
    case 'catalogos': viewCatalogs(q); break;
    case 'equipo': view.innerHTML = viewTeam(); break;
    default: view.innerHTML = emptyPage('Página no encontrada', 'Vuelve al panel para continuar.');
  }
  if (S.lastPath !== path) { S.lastPath = path; window.scrollTo(0, 0); }
}
window.addEventListener('hashchange', render);

function updateSync() {
  const c = pendingCounts();
  const n = S.pending.size;
  let state = 'idle'; let text = 'Conectando…';
  if (S.mode === 'local') { state = 'pending'; text = 'Solo en este dispositivo'; }
  else if (S.mode === 'cloud') {
    if (!S.canWrite) { state = 'idle'; text = 'Solo lectura'; }
    else if (!S.online) { state = 'offline'; text = `Sin conexión${n ? ` · ${n} pendientes` : ''}`; }
    else if (n || c.media) { state = 'pending'; text = S.flushing ? 'Sincronizando…' : `${n + c.media} pendientes`; }
    else { state = 'ok'; text = 'Sincronizado'; }
  }
  for (const [pill, txt] of [['sync-pill', 'sync-text'], ['sync-pill-m', 'sync-text-m']]) {
    const p = document.getElementById(pill); if (p) p.dataset.state = state;
    const t = document.getElementById(txt); if (t) t.textContent = text;
  }
}
window.addEventListener('online', () => { S.online = true; S.retryMs = 2000; updateSync(); queueFlush(300); });

const readOnlyBanner = () => (S.mode === 'cloud' && !S.canWrite ? `<div class="banner info">${ic('lock')}<span>Tienes acceso de solo lectura a esta bitácora. Pide a quien la administra acceso para registrar.</span></div>` : '');

function timelineItem(e, { folio, showProject = false, showDate = false } = {}) {
  const t = ETYPE[e.type] || ETYPE.GENERAL;
  const photos = (e.attachments || []).filter((a) => a.kind === 'PHOTO');
  const files = (e.attachments || []).filter((a) => a.kind === 'FILE');
  const cover = photos[0];
  const ncom = all('comments').filter((c) => c.entry_id === e.id).length;
  const sum = entrySummary(e);
  return `<li class="tl-item" style="--tc:var(${t.v})">
    <time class="tl-time" datetime="${esc(e.occurred_at)}">${fmtTime(e.occurred_at)}</time>
    <span class="tl-node" aria-hidden="true"></span>
    <a class="tl-body" href="#/registro/${esc(e.id)}">
      <div class="tl-main">
        <div class="tl-type">${ic(t.icon)}${esc(t.label)}${showDate ? `<span class="muted"> · ${esc(fmtDayShort(e.occurred_at))}</span>` : ''}${folio ? `<span class="folio">${folioTxt(folio)}</span>` : ''}</div>
        ${sum ? `<div class="tl-sum">${esc(sum)}</div>` : ''}
        ${e.body ? `<div class="tl-text">${esc(e.body)}</div>` : ''}
        ${(e.tags || []).length ? `<div class="tags-line">${e.tags.map((x) => '#' + esc(x)).join('  ')}</div>` : ''}
        <div class="meta">
          <span>${ic('user')}${esc(nameOf(e.author_id))}</span>
          ${showProject ? `<span>${ic('brief')}${esc(projectName(e.project_id))}</span>` : ''}
          ${photos.length ? `<span>${ic('camera')}${photos.length}</span>` : ''}
          ${files.length ? `<span>${ic('clip')}${files.length}</span>` : ''}
          ${ncom ? `<span>${ic('msg')}${ncom}</span>` : ''}
          ${e.lat != null ? `<span title="Con ubicación">${ic('pin')}GPS</span>` : ''}
          ${pendPill('entries', e.id)}
        </div>
      </div>
      ${cover ? `<img class="thumb" data-media="${esc(cover.id)}" src="${esc(mediaSrc(cover))}" alt="${esc(cover.caption || 'Foto del registro')}" loading="lazy">` : ''}
    </a></li>`;
}
function timeline(entries, opts = {}) {
  if (!entries.length) return '';
  const groups = [];
  for (const e of entries) {
    const k = dayKey(e.occurred_at);
    if (!groups.length || groups[groups.length - 1].k !== k) groups.push({ k, items: [] });
    groups[groups.length - 1].items.push(e);
  }
  const fol = opts.projectId ? folios(opts.projectId) : null;
  return groups.map((g) => {
    const hours = g.items.reduce((s, e) => s + laborHours(e), 0);
    return `<section class="day"><header class="day-head"><span class="day-date">${esc(fmtDayShort(g.items[0].occurred_at))}</span>
      <span class="day-meta">${g.items.length} ${g.items.length === 1 ? 'registro' : 'registros'}${hours ? ` · ${fmtQty(hours)} h-persona` : ''}</span></header>
      <ol class="tl">${g.items.map((e) => timelineItem(e, { ...opts, folio: fol?.get(e.id) })).join('')}</ol></section>`;
  }).join('');
}

  const monthExp = entries.filter((e) => D(e.occurred_at) >= monthStart && e.transaction?.kind === 'EXPENSE');
  const expCLP = monthExp.filter((e) => e.transaction.currency === 'CLP').reduce((s, e) => s + (Number(e.transaction.amount) || 0), 0);

      <div class="section-head"><h2>Registros por día</h2><span class="muted">Últimos 14 días, todos los proyectos</span></div>
      <figure class="chart" id="chart-days" role="img" aria-label="Gráfico de barras de registros por día en los últimos 14 días"></figure>
      <details class="data"><summary>Ver datos en tabla</summary><div class="table-wrap" id="chart-table"></div></details>
    </section>
    <div class="grid-2">

      </section>
      <section class="section">
        <div class="section-head"><h2>Últimas ubicaciones</h2></div>
        <div class="card">${withGps.length ? `<table class="t"><tbody>${withGps.map((e) => `<tr>
          <td><a href="#/registro/${esc(e.id)}">${esc(projectName(e.project_id))}</a><div class="muted" style="font-size:12.5px">${esc(fmtDayShort(e.occurred_at))} ${fmtTime(e.occurred_at)} · ${esc(ETYPE[e.type].label)}</div></td>

function projectCard(p) {
  const es = all('entries').filter((e) => e.project_id === p.id);
  const last = es.reduce((m, e) => (e.occurred_at > m ? e.occurred_at : m), '');
  return `<a class="pcard" href="#/proyecto/${esc(p.id)}">
    <div class="row"><h3>${esc(p.name)}</h3>${statusPill(p.status)}</div>
    <div class="meta">${p.code ? `<span class="mono">${esc(p.code)}</span>` : ''}${p.client_name ? `<span>${esc(p.client_name)}</span>` : ''}
      <span>${ic('note')}${es.length} ${es.length === 1 ? 'registro' : 'registros'}</span>
      ${last ? `<span>${ic('cal')}último ${esc(fmtDayShort(last))}</span>` : ''}${pendPill('projects', p.id)}</div></a>`;
}
function drawChart() {
  const el = document.getElementById('chart-days');
  if (!el) return;
  const entries = visibleEntries();
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const k = dayKey(d);
    const es = entries.filter((e) => dayKey(e.occurred_at) === k);
    days.push({ d, k, n: es.length, h: es.reduce((s, e) => s + laborHours(e), 0) });
  }
  const W = Math.max(300, Math.round(el.clientWidth || 600)); const H = 190;
  const pl = 30, pr = 6, pt = 22, pb = 26;
  const max = Math.max(1, ...days.map((x) => x.n));
  const step = Math.max(1, Math.ceil(max / 3)); const top = step * 3;
  const pw = W - pl - pr, ph = H - pt - pb, col = pw / days.length;
  const bw = Math.min(28, Math.max(5, col * 0.62));
  const y = (v) => pt + ph - (v / top) * ph;
  const every = col < 30 ? 2 : 1;
  const maxIdx = days.reduce((bi, x, i) => (x.n > days[bi].n ? i : bi), 0);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line class="${v === 0 ? 'base' : 'grid'}" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  days.forEach((x, i) => {
    const cx = pl + col * i + col / 2; const bx = cx - bw / 2; const by = y(x.n); const bh = pt + ph - by;
    const r = Math.min(4, bw / 2, bh);
    const label = `${cap(fmtDayShort(x.d))}: ${x.n} ${x.n === 1 ? 'registro' : 'registros'}${x.h ? ` · ${fmtQty(x.h)} h-persona` : ''}`;
    svg += `<g class="col" tabindex="0" data-tip="${esc(label)}" aria-label="${esc(label)}"><rect class="hit" x="${pl + col * i}" y="${pt}" width="${col}" height="${ph + pb}"/>`;
    if (x.n > 0) svg += `<path class="bar" d="M${bx},${pt + ph} V${by + r} Q${bx},${by} ${bx + r},${by} H${bx + bw - r} Q${bx + bw},${by} ${bx + bw},${by + r} V${pt + ph} Z"/>`;
    if (x.n > 0 && (i === days.length - 1 || i === maxIdx)) svg += `<text class="val" x="${cx}" y="${by - 6}" text-anchor="middle">${x.n}</text>`;
    if (i % every === (days.length - 1) % every) svg += `<text class="axis" x="${cx}" y="${H - 8}" text-anchor="middle">${i === days.length - 1 ? 'hoy' : x.d.getDate()}</text>`;
    svg += '</g>';
  });
  el.innerHTML = svg + '</svg>';
  const tbl = document.getElementById('chart-table');
  if (tbl) tbl.innerHTML = `<table class="t"><thead><tr><th>Día</th><th class="r">Registros</th><th class="r">Horas-persona</th></tr></thead><tbody>${days.map((x) => `<tr><td>${esc(cap(fmtDayShort(x.d)))}</td><td class="r">${x.n}</td><td class="r">${fmtQty(x.h)}</td></tr>`).join('')}</tbody></table>`;
}
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });

/* ---------- Ubicación (formularios) ---------- */
function locBlock(loc, ns, busy = false, msg = '') {
  return `<div class="field"><span class="lbl">${ns === 'p' ? 'Ubicación del proyecto' : 'Ubicación'}</span>
    <div class="loc-box ${loc ? 'has' : ''}">${ic('pin')}<div>${busy ? 'Obteniendo ubicación…'
      : loc ? `<a class="mono" href="${mapsUrl(loc.lat, loc.lng)}" target="_blank" rel="noopener">${esc(fmtCoords(loc.lat, loc.lng))}</a>${loc.acc != null ? `<div class="muted" style="font-size:12.5px">Precisión ± ${fmtNum(loc.acc)} m</div>` : ''}`
      : '<span class="muted">Sin ubicación</span>'}</div></div>
    ${msg ? `<small class="hint" style="color:var(--warn)">${esc(msg)}</small>` : ''}
    <div class="actions"><button type="button" class="btn sm" data-act="gps" data-ns="${ns}" ${busy ? 'disabled' : ''}>${ic('locate')}${loc ? 'Actualizar GPS' : 'Capturar GPS'}</button>
      <button type="button" class="btn sm ghost" data-act="manual-loc" data-ns="${ns}">Ingresar coordenadas</button>
      ${loc ? `<button type="button" class="btn sm ghost" data-act="clear-loc" data-ns="${ns}">${ic('x')}Quitar</button>` : ''}</div></div>`;
}
function setLoc(ns, loc, busy = false, msg = '') {
  if (ns === 'p') { if (!PF) return; PF.loc = loc; document.getElementById('p-loc').innerHTML = locBlock(loc, 'p', busy, msg); }
  else { if (!F) return; F.loc = loc; F.locBusy = busy; F.locMsg = msg; const el = document.getElementById('f-loc'); if (el) el.innerHTML = locBlock(loc, 'f', busy, msg); }
}
function captureGps(ns) {
  const token = ns === 'p' ? PF : F;
  const cur = ns === 'p' ? PF?.loc : F?.loc;
  if (!navigator.geolocation) { setLoc(ns, cur, false, 'Este navegador no entrega ubicación. Ingresa las coordenadas a mano.'); return; }
  setLoc(ns, cur, true);
  navigator.geolocation.getCurrentPosition(
    (pos) => { if ((ns === 'p' ? PF : F) !== token) return; setLoc(ns, { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy) }); },
    (err) => {
      if ((ns === 'p' ? PF : F) !== token) return;
      setLoc(ns, cur, false, err.code === 1
        ? 'El navegador no dio permiso de ubicación. Actívalo o ingresa las coordenadas a mano.'
        : 'Sin señal GPS por ahora. Puedes guardar igual o ingresar las coordenadas a mano.');
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 },
  );
}
async function manualLoc(ns) {
  const v = await promptBox({ title: 'Coordenadas', label: 'Latitud, longitud', hint: 'Ejemplo: -22.45600, -68.92900 (puedes copiarlas desde Google Maps)', ok: 'Usar' });
  if (!v) return;
  const nums = v.replace(/[;]/g, ',').match(/-?\d+(?:\.\d+)?/g);
  const lat = nums ? Number(nums[0]) : NaN; const lng = nums ? Number(nums[1]) : NaN;
  if (!(Math.abs(lat) <= 90 && Math.abs(lng) <= 180)) { toast('No reconocí las coordenadas. Usa el formato -22.456, -68.929', 'bad'); return; }
  setLoc(ns, { lat, lng, acc: null });
}

function setF(path, value) {

  const line = F[a]?.find((l) => l.id === b); if (line) line[c] = value;
}
function getF(path) {
  const [a, b, c] = path.split('.');

function validateF() {
  if (!F.project_id) return 'Selecciona el proyecto.';
  if (!(F.occurred instanceof Date) || Number.isNaN(F.occurred.getTime())) return 'Revisa la fecha y hora.';
  if (F.type === 'GENERAL' && !F.body.trim()) return 'Escribe la descripción del registro.';
  if (F.type === 'LABOR') {
    for (const [i, l] of F.labor.entries()) {
      if (!l.worker_id) return `Selecciona la persona ${i + 1}.`;
      const h = parseDecimal(l.hours);
      if (h === null || h <= 0 || h > 24) return `Las horas de la persona ${i + 1} deben estar entre 0 y 24.`;
    }
  }
  if (F.type === 'STOCK') {
    for (const [i, l] of F.stock.entries()) {
      if (!l.item_id) return `Selecciona el ítem ${i + 1}.`;
      const qn = parseDecimal(l.quantity);
      if (qn === null || qn <= 0) return `La cantidad del ítem ${i + 1} debe ser mayor que 0.`;
    }
  }
  if (F.type === 'TRANSACTION') {
    const amt = parseDecimal(F.tx.amount);
    if (amt === null || amt < 0) return 'Ingresa un monto válido.';
    if (!F.tx.concept.trim()) return 'Ingresa el concepto.';
  }
  return null;
}

    labor: F.type === 'LABOR' ? F.labor.map((l) => ({ id: l.id, worker_id: l.worker_id, task: (l.task || '').trim(), hours: parseDecimal(l.hours) })) : [],
    stock: F.type === 'STOCK' ? F.stock.map((l) => ({ id: l.id, item_id: l.item_id, direction: l.direction, quantity: parseDecimal(l.quantity), responsible_id: l.responsible_id || null })) : [],
    transaction: F.type === 'TRANSACTION' ? { kind: F.tx.kind, amount: parseDecimal(F.tx.amount), currency: F.tx.currency, concept: F.tx.concept.trim(), document_number: (F.tx.document_number || '').trim() || null } : null,
    attachments: F.atts.map(({ previewUrl, isNew, ...a }) => a),

  }
  const wasEdit = F.isEdit; const id = F.id;

}
async function addPhotos(files) {
  if (!F) return;
  F.attBusy = true; rerender('f-atts', attsSection);
  for (const file of files) {
    try {
      const r = await toJpeg(file, 1600, 0.72);
      const id = uuid();
      F.newBlobs.set(id, r.blob);
      F.atts.push({ id, kind: 'PHOTO', name: `foto-${dayKey(new Date())}-${id.slice(-6)}.jpg`, mime: 'image/jpeg', size: r.blob.size, width: r.width, height: r.height, caption: '', isNew: true, previewUrl: await blobToDataUrl(r.blob) });
    } catch { toast(`No se pudo procesar ${file.name}`, 'bad'); }
  }
  F.attBusy = false; rerender('f-atts', attsSection);
}
function addFiles(files) {
  if (!F) return;
  for (const file of files) {
    if (file.size > 20 * 1024 * 1024) { toast(`${file.name} supera los 20 MB`, 'bad'); continue; }
    const id = uuid();
    F.newBlobs.set(id, file);
    F.atts.push({ id, kind: 'FILE', name: file.name, mime: file.type || 'application/octet-stream', size: file.size, caption: '', isNew: true });
  }
  rerender('f-atts', attsSection);
}
for (const [inputId, handler] of [['in-camera', addPhotos], ['in-gallery', addPhotos], ['in-file', addFiles]]) {
  document.getElementById(inputId).addEventListener('change', (ev) => {
    const files = [...(ev.target.files || [])]; ev.target.value = '';
    if (files.length) handler(files);
  });
}

const SF = { text: '', types: [], project: '', author: '', tag: '', from: '', to: '' };
function searchResults() {
  const text = SF.text.trim().toLowerCase();
  const from = SF.from ? parseDateOnly(SF.from) : null;
  const to = SF.to ? new Date(parseDateOnly(SF.to).getTime() + 864e5) : null;
  return visibleEntries().filter((e) => {
    if (SF.types.length && !SF.types.includes(e.type)) return false;
    if (SF.project && e.project_id !== SF.project) return false;
    if (SF.author && e.author_id !== SF.author) return false;
    if (SF.tag && !(e.tags || []).includes(SF.tag)) return false;
    const d = D(e.occurred_at);
    if (from && d < from) return false;
    if (to && d >= to) return false;
    if (text) {
      const hay = [e.body, (e.tags || []).join(' '), e.transaction?.concept, byId('suppliers', e.supplier_id)?.name, entrySummary(e), projectName(e.project_id)].join(' ').toLowerCase();
      if (!hay.includes(text)) return false;
    }
    return true;
  });
}

async function editCatalog(id) {
  const kind = CAT.kind; const def = CATDEF[kind];
  const rec = id ? byId(kind, id) : null;

    ${def.fields.map((f) => `<label class="field"><span>${esc(f.l)}${f.req ? ' *' : ''}</span><input id="c-${f.k}" value="${esc(rec?.[f.k] ?? (f.k === 'unit' ? 'un' : ''))}" placeholder="${esc(f.ph || '')}"></label>`).join('')}

    <div class="dlg-actions">${rec && canDeleteCatalog() ? `<button type="button" class="btn danger" data-v="delete">${ic('trash')}Eliminar</button><span class="spacer"></span>` : ''}
      <button type="button" class="btn ghost" data-v="cancel">Cancelar</button><button class="btn primary" type="submit">Guardar</button></div></form>`,
  (d, done) => {
    d.querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => done(b.dataset.v); });
    d.querySelector('form').onsubmit = (ev) => {
      ev.preventDefault();
      const vals = {};
      for (const f of def.fields) vals[f.k] = d.querySelector(`#c-${f.k}`).value.trim() || null;
      const missing = def.fields.find((f) => f.req && !vals[f.k]);
      if (missing) { toast(`Completa «${missing.l}».`, 'bad'); return; }
      if (kind === 'items') vals.category = d.querySelector('#c-category').value;
      done({ vals });
    };
    setTimeout(() => d.querySelector('input')?.focus(), 30);
  });
  if (result === 'delete') {
    if (await confirmBox({ title: `Eliminar ${def.single}`, message: 'Los registros existentes conservarán la referencia.', ok: 'Eliminar', danger: true })) { await softDelete(kind, rec); toast('Eliminado'); }
  } else if (result?.vals) {
    await save(kind, { ...(rec || {}), id: rec?.id || uuid(), ...result.vals });
    toast('Guardado');
  }
}

/* ============================================================
   Exportación: Excel (CSV) y PDF
   ============================================================ */
async function saveFile(filename, data, mime) {
  if (S.downloads) {
    try { await S.downloads.save({ filename, data }); toast('Archivo listo'); return; }
    catch (e) {
      if (e?.code === 'declined') return;
      if (!['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e?.code)) { toast(`No se pudo guardar el archivo (${e?.code || 'error'}).`, 'bad'); return; }
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function exportScope(el) {
  if (el.dataset.scope === 'project') {
    const p = byId('projects', el.dataset.id);
    return { entries: visibleEntries().filter((e) => e.project_id === p.id), title: p.name, subtitle: [p.code, p.client_name].filter(Boolean).join(' · '), project: p };
  }
  return { entries: searchResults(), title: 'Bitácora de campo', subtitle: describeSearch(), project: null };
}
function csvCell(v) {
  if (v === null || v === undefined) return '';
  const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
  return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
async function exportCsv(scope) {
  if (!scope.entries.length) { toast('No hay registros para exportar.', 'bad'); return; }
  const header = ['Folio', 'Fecha', 'Hora', 'Proyecto', 'Tipo', 'Responsable', 'Descripción', 'Etiquetas', 'Proveedor', 'Detalle', 'Horas', 'Movimiento', 'Monto', 'Moneda', 'Concepto', 'N° documento', 'Latitud', 'Longitud', 'Fotos', 'Archivos'];
  const fol = {};
  const rows = scope.entries.map((e) => {
    fol[e.project_id] ||= folios(e.project_id);
    const detail = e.type === 'LABOR' ? (e.labor || []).map((l) => `${byId('workers', l.worker_id)?.full_name || '—'}${l.task ? ': ' + l.task : ''} (${fmtQty(l.hours)} h)`).join(' | ')
      : e.type === 'STOCK' ? (e.stock || []).map((l) => `${byId('items', l.item_id)?.name || '—'}: ${l.direction === 'IN' ? 'entrada' : 'salida'} ${fmtQty(l.quantity)} ${byId('items', l.item_id)?.unit || ''}`).join(' | ') : '';
    const tx = e.transaction;
    return [folioTxt(fol[e.project_id].get(e.id)), fmtDate(e.occurred_at), fmtTime(e.occurred_at), projectName(e.project_id), ETYPE[e.type].label, nameOf(e.author_id), e.body, (e.tags || []).join(', '),
      byId('suppliers', e.supplier_id)?.name, detail, e.type === 'LABOR' ? laborHours(e) : null, tx ? (tx.kind === 'INCOME' ? 'Ingreso' : 'Egreso') : null, tx?.amount ?? null, tx?.currency, tx?.concept, tx?.document_number,
      e.lat, e.lng, (e.attachments || []).filter((a) => a.kind === 'PHOTO').length, (e.attachments || []).filter((a) => a.kind === 'FILE').length];
  });
  const csv = '﻿' + [header, ...rows].map((r) => r.map(csvCell).join(';')).join('\r\n');
  await saveFile(`bitacora-${dayKey(new Date())}.csv`, csv, 'text/csv');
}
function loadScript(src) {
  if (document.querySelector(`script[src="${src}"]`) && (window.jspdf)) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('sin conexión')); document.head.appendChild(s); });
}
async function exportPdf(scope) {
  if (!scope.entries.length) { toast('No hay registros para exportar.', 'bad'); return; }
  toast('Generando PDF…');
  try {
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if (!window.jspdf?.jsPDF?.API?.autoTable) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  } catch { toast('El PDF necesita conexión para cargar el generador. Prueba con Excel.', 'bad'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 14, BOTTOM = 283; let y = M;
  const NAVY = [27, 63, 99], INK = [20, 33, 43], MUTED = [94, 109, 121], AMBER = [232, 163, 23];
  const ensure = (h) => { if (y + h > BOTTOM) { doc.addPage(); y = M; } };
  const text = (str, size, color, style = 'normal', indent = 0) => {
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(String(str), W - 2 * M - indent);
    const lh = size * 0.42;
    for (const ln of lines) { ensure(lh + 1); doc.text(ln, M + indent, y + lh); y += lh + 0.6; }
  };
  const table = (head, body, widths) => {
    doc.autoTable({ startY: y, head: [head], body, margin: { left: M, right: M }, theme: 'grid',
      styles: { fontSize: 8.5, cellPadding: 1.4, textColor: INK, lineColor: [211, 218, 224] }, headStyles: { fillColor: [224, 233, 242], textColor: INK, fontStyle: 'bold' },
      columnStyles: widths || {} });
    y = doc.lastAutoTable.finalY + 2;
  };
  text(scope.title, 17, NAVY, 'bold');
  if (scope.subtitle) text(scope.subtitle, 9.5, MUTED);
  text(`Generado el ${fmtDT(new Date())} por ${nameOf(S.me.id)} · ${scope.entries.length} registros`, 9, MUTED);
  y += 2;
  if (scope.project) {
    const sm = projectSummary(scope.project.id);
    text('Resumen', 12, NAVY, 'bold');
    table(['Indicador', 'Valor'], [['Registros', String(sm.total)], ['Horas-persona', `${fmtQty(sm.hours)} h`],
      ...sm.money.map((m) => [`${m.kind === 'INCOME' ? 'Ingresos' : 'Egresos'} (${m.currency})`, fmtMoney(m.total, m.currency)])], { 1: { halign: 'right' } });
    if (sm.workers.length) table(['Persona', 'Horas'], sm.workers.map((w) => [w.name, `${fmtQty(w.hours)} h`]), { 1: { halign: 'right' } });
    if (sm.stock.length) table(['Ítem', 'Entradas', 'Salidas', 'Saldo'], sm.stock.map((s) => [s.name, `${fmtQty(s.in)} ${s.unit}`, `${fmtQty(s.out)} ${s.unit}`, `${fmtQty(s.in - s.out)} ${s.unit}`]), { 1: { halign: 'right' }, 2: { halign: 'right' }, 3: { halign: 'right' } });
  }
  const sorted = [...scope.entries].sort((a, b) => a.occurred_at.localeCompare(b.occurred_at));
  const fol = {};
  let budget = 40, omitted = 0, day = '';
  for (const e of sorted) {
    fol[e.project_id] ||= folios(e.project_id);
    const k = dayKey(e.occurred_at);
    if (k !== day) {
      day = k; ensure(16); y += 3;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(...NAVY); doc.text(cap(fmtDayLong(e.occurred_at)), M, y + 4.5);
      doc.setDrawColor(...AMBER); doc.setLineWidth(0.7); doc.line(M, y + 6.5, W - M, y + 6.5); y += 9;
    }
    ensure(14); y += 1;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...INK);
    doc.text(`${fmtTime(e.occurred_at)}  ${ETYPE[e.type].label.toUpperCase()}  ·  ${nameOf(e.author_id)}${scope.project ? '' : `  ·  ${projectName(e.project_id)}`}`, M, y + 4);
    doc.setFont('helvetica', 'normal'); doc.setTextColor(...MUTED); doc.text(folioTxt(fol[e.project_id].get(e.id)), W - M, y + 4, { align: 'right' });
    y += 6;
    if (e.type === 'LABOR' && e.labor?.length) table(['Persona', 'Tarea', 'Horas'], e.labor.map((l) => [byId('workers', l.worker_id)?.full_name || '—', l.task || '', fmtQty(l.hours)]), { 2: { halign: 'right', cellWidth: 18 } });
    if (e.type === 'STOCK' && e.stock?.length) table(['Ítem', 'Movimiento', 'Cantidad', 'Responsable'], e.stock.map((l) => [byId('items', l.item_id)?.name || '—', l.direction === 'IN' ? 'Entrada' : 'Salida', `${fmtQty(l.quantity)} ${byId('items', l.item_id)?.unit || ''}`, byId('workers', l.responsible_id)?.full_name || '—']), { 2: { halign: 'right' } });
    if (e.transaction) text(`${e.transaction.kind === 'INCOME' ? 'Ingreso' : 'Egreso'}: ${fmtMoney(e.transaction.amount, e.transaction.currency)} — ${e.transaction.concept}${e.transaction.document_number ? ` (doc. ${e.transaction.document_number})` : ''}`, 9.5, INK, 'bold');
    if (e.body) text(e.body, 9.5, INK);
    const meta = [byId('suppliers', e.supplier_id) && `Proveedor: ${byId('suppliers', e.supplier_id).name}`, (e.tags || []).length && e.tags.map((t) => '#' + t).join(' '),
      e.lat != null ? `Ubicación: ${fmtCoords(e.lat, e.lng)}${e.accuracy_m != null ? ` (± ${fmtNum(e.accuracy_m)} m)` : ''}` : 'Sin ubicación'].filter(Boolean).join('  ·  ');
    text(meta, 8.5, MUTED);
    const photos = (e.attachments || []).filter((a) => a.kind === 'PHOTO');
    const shown = [];
    for (const a of photos.slice(0, 2)) {
      if (budget <= 0) break;
      try { const url = await mediaDataUrl(a); shown.push({ a, url }); budget--; } catch { /* se omite */ }
    }
    omitted += photos.length - shown.length;
    if (shown.length) {
      const pw = (W - 2 * M - 6) / 2;
      const hs = shown.map(({ a }) => Math.min(62, pw * ((a.height || 3) / (a.width || 4))));
      const ph = Math.max(...hs);
      ensure(ph + 10);
      shown.forEach(({ a, url }, i) => {
        const x = M + i * (pw + 6);
        try { doc.addImage(url, 'JPEG', x, y + 1, pw, hs[i]); } catch { /* formato no soportado */ }
        if (a.caption) { doc.setFontSize(8); doc.setTextColor(...MUTED); doc.text(doc.splitTextToSize(a.caption, pw).slice(0, 2), x, y + hs[i] + 4.5); }
      });
      y += ph + (shown.some(({ a }) => a.caption) ? 10 : 3);
    }
    const files = (e.attachments || []).filter((a) => a.kind === 'FILE');
    if (files.length) text(`Adjuntos: ${files.map((f) => f.name).join(', ')}`, 8.5, MUTED);
    for (const c of all('comments').filter((x) => x.entry_id === e.id).sort((a, b) => a.created_at.localeCompare(b.created_at))) text(`${nameOf(c.author_id)} (${fmtDT(c.created_at)}): ${c.body}`, 8.5, INK, 'italic', 4);
    y += 1.5; ensure(2); doc.setDrawColor(228, 233, 237); doc.setLineWidth(0.3); doc.line(M, y, W - M, y); y += 1;
  }
  if (omitted) { y += 2; text(`${omitted} fotos no se incluyeron para mantener un tamaño manejable; están disponibles en la bitácora.`, 8.5, MUTED, 'italic'); }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text('Bitácora de Campo', M, 292); doc.text(`${i} / ${pages}`, W - M, 292, { align: 'right' });
  }
  await saveFile(`bitacora-${dayKey(new Date())}.pdf`, doc.output('blob'), 'application/pdf');
}

  'local-add': async () => {

  'sf-type': (el) => { const t = el.dataset.val; SF.types = SF.types.includes(t) ? SF.types.filter((x) => x !== t) : [...SF.types, t]; el.setAttribute('aria-pressed', String(SF.types.includes(t))); renderSearchResults(); },
  'sf-clear': () => { Object.assign(SF, { text: '', types: [], project: '', author: '', tag: '', from: '', to: '' }); viewSearch(); },
  'export-pdf': (el) => exportPdf(exportScope(el)),

document.addEventListener('click', (ev) => {

document.addEventListener('change', async (ev) => {
  const el = ev.target;

   Arranque
   ============================================================ */
async function boot() {
  await Local.open();
  const recs = (await Local.all('records')) || [];
  for (const r of recs) {
    if (!S.data[r.col]) continue;
    S.data[r.col].set(r.id, r.data);
    if (r.pending) S.pending.add(keyOf(r.col, r.id));
  }
  let cloud = false;
  try { cloud = await initCloud(); } catch (e) { console.warn('Nube no disponible', e); }
  if (!cloud) {
    S.mode = 'local';
    const cur = await Local.get('meta', 'currentUser');
    if (cur && S.data.members.get(cur)) S.me = { id: cur };
  } else queueFlush(500);
  render();
  updateSync();
}
boot();
})();
